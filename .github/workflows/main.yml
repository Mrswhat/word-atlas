name: Deploy GitHub Pages

on:
  push:
    branches:
      - main # 当 main 分支有代码推送时触发自动化部署

# 设置权限，允许 Action 写入 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # 升级到最新的 Node.js 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          ATLAS_BASE: /word-atlas/

      - name: Upload artifact
        # 升级到 v3 以完全兼容最新的 GitHub 运行环境
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Vite 编译生成的静态文件夹

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
