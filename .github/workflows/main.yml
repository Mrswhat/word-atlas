name: Deploy GitHub Pages

on:
  push:
    branches:
      - main # 当 main 分支有代码推送时触发自动化部署

# 设置权限，允许 Action 写入 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # 核心：原项目已支持 ATLAS_BASE 变量，这里直接注入你的二级子路径
        run: npm run build
        env:
          ATLAS_BASE: /word-atlas/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Vite 编译生成的静态文件夹

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
